<!DOCTYPE html>
<html>
<head>
    <title>Keranjang Booking - Lucky Nailart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h2>Keranjang Anda</h2>
    
    {% if keranjang %}
        <table border="1">
            <tr>
                <th>Motif</th>
                <th>Harga</th>
                <th>Jumlah</th>
                <th>Subtotal</th>
            </tr>
            {% for id, item in keranjang.items() %}
            <tr>
                <td>{{ item.nama }}</td>
                <td>Rp {{ item.harga }}</td>
                <td>{{ item.jumlah }}</td>
                <td>Rp {{ item.harga * item.jumlah }}</td>
            </tr>
            {% endfor %}
        </table>
        
        <h3>Total: Rp {{ total }}</h3>

        <!-- Form Booking -->
        <form action="{{ url_for('checkout') }}" method="POST">
            <label>Pilih Jadwal Kedatangan/Booking:</label>
            <input type="datetime-local" name="jadwal_kedatangan" required>
            <br><br>
            <button type="submit">Konfirmasi Booking</button>
        </form>
    {% else %}
        <p>Keranjang masih kosong.</p>
        <a href="/">Kembali ke Katalog</a>
    {% endif %}
</body>
</html>
